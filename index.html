<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7AC74F">
<title>やさいをたべてスリムになろう！</title>
<style>
  :root{
    --bg-sky:#B5E6FF;
    --bg-grass:#7AC74F;
    --cream:#FFF8E7;
    --carrot:#FF8C42;
    --tomato:#E74C3C;
    --leaf:#4CAF50;
    --eggplant:#8B5A9E;
    --text:#3A2818;
    --shadow:rgba(58,40,24,.18);
    --key-face:#FFF8E7;
    --key-shadow:#C9B99A;
    --key-modifier:#FFB347;
    --key-modifier-shadow:#C77A1F;
    --heart:#E74C3C;
    --safe-bottom:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  html,body{
    height:100%;
    overflow:hidden;
    font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Yu Gothic",sans-serif;
    color:var(--text);
    background:linear-gradient(180deg,var(--bg-sky) 0%,var(--bg-sky) 55%,var(--bg-grass) 55%,var(--bg-grass) 100%);
    touch-action:manipulation;
    overscroll-behavior:none;
  }
  #app{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    padding-bottom:var(--safe-bottom);
  }

  /* ==================== タイトル画面 ==================== */
  .screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:16px;
    z-index:10;
  }
  .screen.hidden{display:none;}
  .title-logo{
    font-size:clamp(28px,7vw,44px);
    font-weight:900;
    color:#fff;
    text-shadow:0 4px 0 var(--eggplant),0 8px 12px rgba(0,0,0,.2);
    text-align:center;
    line-height:1.2;
    margin-bottom:12px;
    letter-spacing:.02em;
  }
  .title-sub{
    font-size:16px;
    background:var(--cream);
    padding:6px 16px;
    border-radius:999px;
    box-shadow:0 3px 0 var(--key-shadow);
    margin-bottom:20px;
  }
  .title-char{
    width:180px;
    height:180px;
    margin-bottom:16px;
    animation:idleBounce 1.6s ease-in-out infinite;
  }
  .card{
    background:var(--cream);
    border-radius:18px;
    padding:16px;
    box-shadow:0 6px 0 var(--key-shadow),0 12px 20px rgba(0,0,0,.15);
    width:min(360px,92vw);
    margin-bottom:14px;
  }
  .card h3{
    font-size:15px;
    margin-bottom:10px;
    color:var(--eggplant);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .opt-row{
    display:grid;
    gap:8px;
  }
  .opt-row.theme{grid-template-columns:1fr 1fr;}
  .opt-row.level{grid-template-columns:1fr 1fr 1fr;}
  .opt-btn{
    background:#fff;
    border:3px solid var(--key-shadow);
    border-radius:12px;
    padding:12px 8px;
    font-size:15px;
    font-weight:700;
    color:var(--text);
    cursor:pointer;
    transition:transform .1s;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    min-height:52px;
  }
  .opt-btn .emoji{font-size:20px;}
  .opt-btn.active{
    background:var(--carrot);
    border-color:var(--carrot);
    color:#fff;
    box-shadow:0 3px 0 #B8551A;
    transform:translateY(-1px);
  }
  .start-btn{
    background:var(--tomato);
    color:#fff;
    border:none;
    border-radius:999px;
    padding:16px 40px;
    font-size:22px;
    font-weight:900;
    box-shadow:0 6px 0 #8B2E2E,0 10px 20px rgba(0,0,0,.2);
    cursor:pointer;
    letter-spacing:.05em;
  }
  .start-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8B2E2E;}

  /* ==================== ゲーム画面 ==================== */
  #game-screen{
    display:flex;
    flex-direction:column;
    width:100%;
    height:100%;
  }
  .hud{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 12px;
    gap:8px;
  }
  .hud-lives{display:flex;gap:4px;}
  .heart{
    width:28px;
    height:28px;
    background:var(--heart);
    -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 21s-7-4.5-9.5-9C.7 8.5 3 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6.3 4.5 4.5 8-2.5 4.5-9.5 9-9.5 9z'/></svg>") center/contain no-repeat;
            mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 21s-7-4.5-9.5-9C.7 8.5 3 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6.3 4.5 4.5 8-2.5 4.5-9.5 9-9.5 9z'/></svg>") center/contain no-repeat;
    filter:drop-shadow(0 2px 0 #8B2E2E);
  }
  .heart.lost{background:#999;filter:none;opacity:.4;}
  .score-box{
    background:var(--cream);
    padding:6px 14px;
    border-radius:999px;
    font-weight:900;
    font-size:16px;
    box-shadow:0 3px 0 var(--key-shadow);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .score-box .label{font-size:11px;color:#888;}
  .home-btn{
    background:var(--cream);
    border:none;
    width:38px;
    height:38px;
    border-radius:50%;
    font-size:18px;
    box-shadow:0 3px 0 var(--key-shadow);
    cursor:pointer;
  }
  .timer-wrap{
    padding:0 12px 4px;
  }
  .timer-bar{
    height:14px;
    background:rgba(255,255,255,.5);
    border-radius:999px;
    overflow:hidden;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.15);
    border:2px solid var(--cream);
  }
  .timer-fill{
    height:100%;
    background:linear-gradient(90deg,#7AC74F,#FFD93D 60%,#E74C3C);
    transition:width .2s linear;
    border-radius:999px;
  }

  /* ステージ */
  .stage{
    flex:1;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:8px 12px 4px;
    overflow:hidden;
  }
  .character-area{
    position:relative;
    width:100%;
    max-width:380px;
    flex:0 0 auto;
    display:flex;
    justify-content:center;
    align-items:center;
    height:38vh;
    min-height:200px;
    max-height:260px;
  }
  .character{
    width:100%;
    height:100%;
    transition:transform .8s cubic-bezier(.34,1.56,.64,1);
    filter:drop-shadow(0 8px 12px rgba(0,0,0,.15));
  }
  .character.chomp .mouth{
    animation:mouthChomp .5s ease-out;
  }
  .character.chomp .char-body{
    animation:bodyBounce .5s ease-out;
  }
  .character.happy .eyes-open{opacity:0;}
  .character.happy .eyes-happy{opacity:1;}
  .eyes-happy{opacity:0;transition:opacity .1s;}
  .eyes-open{transition:opacity .1s;}

  @keyframes mouthChomp{
    0%{rx:14;ry:8;}
    30%{rx:28;ry:28;}
    60%{rx:20;ry:14;}
    100%{rx:14;ry:8;}
  }
  @keyframes bodyBounce{
    0%,100%{transform:translateY(0);}
    30%{transform:translateY(-8px);}
    60%{transform:translateY(4px);}
  }
  @keyframes idleBounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-6px);}
  }

  .veggie-fly{
    position:absolute;
    font-size:56px;
    left:80%;
    top:20%;
    pointer-events:none;
    z-index:5;
  }
  .veggie-fly.launch{
    animation:veggieFly .55s cubic-bezier(.5,-.2,.7,.5) forwards;
  }
  @keyframes veggieFly{
    0%{left:80%;top:20%;transform:scale(1.4) rotate(0);opacity:1;}
    70%{left:52%;top:38%;transform:scale(1.1) rotate(360deg);opacity:1;}
    100%{left:50%;top:44%;transform:scale(.2) rotate(720deg);opacity:0;}
  }

  .word-area{
    background:var(--cream);
    border-radius:22px;
    padding:12px 20px 14px;
    box-shadow:0 5px 0 var(--key-shadow),0 12px 20px rgba(0,0,0,.15);
    width:calc(100% - 8px);
    max-width:380px;
    margin-top:auto;
    margin-bottom:6px;
    text-align:center;
    position:relative;
  }
  .word-emoji{
    font-size:34px;
    display:block;
    margin-bottom:2px;
  }
  ruby{
    font-size:clamp(28px,8vw,42px);
    font-weight:900;
    line-height:1.1;
    ruby-align:center;
  }
  rt{
    font-size:.42em;
    color:var(--eggplant);
    font-weight:700;
    letter-spacing:.1em;
  }
  .typed-display{
    margin-top:6px;
    font-size:24px;
    font-weight:900;
    letter-spacing:.15em;
    min-height:32px;
    display:flex;
    justify-content:center;
    gap:2px;
    flex-wrap:wrap;
  }
  .typed-char{
    display:inline-block;
    min-width:24px;
    padding:0 4px;
    border-bottom:3px solid var(--key-shadow);
    color:#ccc;
    transition:color .1s,border-color .1s;
  }
  .typed-char.filled{
    color:var(--leaf);
    border-color:var(--leaf);
  }
  .typed-char.wrong{
    color:var(--tomato);
    border-color:var(--tomato);
    animation:shake .3s;
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    75%{transform:translateX(4px);}
  }

  /* ==================== フリックキーボード ==================== */
  .keyboard{
    flex:0 0 auto;
    background:linear-gradient(180deg,#D8CBA8,#B8A87F);
    padding:6px 6px calc(6px + var(--safe-bottom));
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;
    max-width:500px;
    width:100%;
    margin:0 auto;
    box-shadow:inset 0 3px 4px rgba(0,0,0,.15);
  }
  .key{
    background:var(--key-face);
    border:none;
    border-radius:10px;
    height:52px;
    font-size:22px;
    font-weight:900;
    color:var(--text);
    box-shadow:0 3px 0 var(--key-shadow);
    cursor:pointer;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:none;
    -webkit-touch-callout:none;
    font-family:inherit;
  }
  .key.modifier{
    background:var(--key-modifier);
    color:#fff;
    box-shadow:0 3px 0 var(--key-modifier-shadow);
    font-size:18px;
  }
  .key.modifier.small-mod{font-size:15px;}
  .key.pressed{
    transform:translateY(2px);
    box-shadow:0 1px 0 var(--key-shadow);
  }
  .key.modifier.pressed{box-shadow:0 1px 0 var(--key-modifier-shadow);}

  /* フリックポップアップ（十字表示） */
  .flick-popup{
    position:fixed;
    pointer-events:none;
    z-index:100;
    width:180px;
    height:180px;
    display:none;
    transform:translate(-50%,-50%);
  }
  .flick-popup.active{display:block;}
  .flick-cell{
    position:absolute;
    width:60px;
    height:60px;
    background:var(--cream);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:900;
    color:var(--text);
    box-shadow:0 4px 8px rgba(0,0,0,.25);
    border:2px solid var(--key-shadow);
  }
  .flick-cell.c{left:50%;top:50%;transform:translate(-50%,-50%);}
  .flick-cell.u{left:50%;top:0;transform:translateX(-50%);}
  .flick-cell.d{left:50%;bottom:0;transform:translateX(-50%);}
  .flick-cell.l{left:0;top:50%;transform:translateY(-50%);}
  .flick-cell.r{right:0;top:50%;transform:translateY(-50%);}
  .flick-cell.highlight{
    background:var(--carrot);
    color:#fff;
    border-color:var(--carrot);
    transform:translate(-50%,-50%) scale(1.15);
  }
  .flick-cell.u.highlight,.flick-cell.d.highlight{transform:translateX(-50%) scale(1.15);}
  .flick-cell.l.highlight,.flick-cell.r.highlight{transform:translateY(-50%) scale(1.15);}
  .flick-cell.empty{opacity:0;}

  /* ==================== エフェクト ==================== */
  .fx-flash{
    position:fixed;
    inset:0;
    background:radial-gradient(circle,rgba(255,220,100,.7),transparent 60%);
    pointer-events:none;
    z-index:20;
    opacity:0;
  }
  .fx-flash.active{animation:flash .4s ease-out;}
  @keyframes flash{
    0%{opacity:0;}
    30%{opacity:1;}
    100%{opacity:0;}
  }

  .fx-text{
    position:fixed;
    top:35%;
    left:50%;
    transform:translate(-50%,-50%) scale(0);
    font-size:64px;
    font-weight:900;
    color:#fff;
    text-shadow:0 4px 0 var(--tomato),0 6px 12px rgba(0,0,0,.4);
    pointer-events:none;
    z-index:30;
    white-space:nowrap;
    font-style:italic;
    letter-spacing:.03em;
  }
  .fx-text.pop{animation:pop .9s ease-out forwards;}
  @keyframes pop{
    0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg);opacity:0;}
    30%{transform:translate(-50%,-50%) scale(1.3) rotate(-8deg);opacity:1;}
    50%{transform:translate(-50%,-50%) scale(1) rotate(-8deg);}
    100%{transform:translate(-50%,-70%) scale(1.1) rotate(-8deg);opacity:0;}
  }

  .confetti{
    position:fixed;
    top:0;
    width:10px;
    height:14px;
    pointer-events:none;
    z-index:25;
  }

  /* ==================== ゲームオーバー・クリア ==================== */
  .over-title{
    font-size:44px;
    font-weight:900;
    color:#fff;
    text-shadow:0 5px 0 var(--eggplant),0 10px 15px rgba(0,0,0,.3);
    margin-bottom:12px;
    text-align:center;
  }
  .stat-row{
    display:flex;
    justify-content:space-between;
    padding:8px 4px;
    font-size:17px;
    font-weight:700;
    border-bottom:2px dashed var(--key-shadow);
  }
  .stat-row:last-child{border-bottom:none;}
  .stat-row .val{color:var(--carrot);}
  .btn-row{display:flex;gap:12px;margin-top:8px;}
  .sec-btn{
    background:var(--cream);
    border:3px solid var(--eggplant);
    color:var(--eggplant);
    border-radius:999px;
    padding:12px 22px;
    font-size:15px;
    font-weight:900;
    box-shadow:0 4px 0 var(--eggplant);
    cursor:pointer;
  }
  .sec-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--eggplant);}

  /* 小画面調整 */
  @media (max-height:700px){
    .title-char{width:130px;height:130px;}
    .character-area{height:32vh;min-height:170px;}
    .key{height:46px;font-size:20px;}
  }
</style>
</head>
<body>
<div id="app">

  <!-- =============== タイトル画面 =============== -->
  <div id="title-screen" class="screen">
    <div class="title-logo">やさいをたべて<br>スリムになろう！</div>
    <div class="title-sub">🥕 フリックにゅうりょくゲーム 🥦</div>
    <svg class="title-char" viewBox="-100 -120 200 240">
      <ellipse cx="0" cy="110" rx="55" ry="7" fill="rgba(0,0,0,.15)"/>
      <g>
        <rect x="-22" y="55" width="17" height="42" rx="8" fill="#5B7DC4"/>
        <rect x="5" y="55" width="17" height="42" rx="8" fill="#5B7DC4"/>
        <ellipse cx="-13" cy="100" rx="13" ry="6" fill="#3A2818"/>
        <ellipse cx="13" cy="100" rx="13" ry="6" fill="#3A2818"/>
        <ellipse cx="-55" cy="20" rx="12" ry="28" fill="#FFD9A8" transform="rotate(-15 -55 20)"/>
        <ellipse cx="55" cy="20" rx="12" ry="28" fill="#FFD9A8" transform="rotate(15 55 20)"/>
        <ellipse cx="0" cy="25" rx="60" ry="50" fill="#FFD9A8"/>
        <path d="M -55 25 Q -55 -25 -30 -30 L 30 -30 Q 55 -25 55 25 L 55 60 L -55 60 Z" fill="#FF6B6B"/>
        <ellipse cx="0" cy="40" rx="38" ry="20" fill="#FFD9A8"/>
        <circle cx="0" cy="-55" r="48" fill="#FFD9A8"/>
        <path d="M -42 -70 Q -20 -108 0 -100 Q 20 -108 42 -70 L 32 -55 Q 0 -85 -32 -55 Z" fill="#3A2818"/>
        <circle cx="-25" cy="-42" r="9" fill="#FFA5A5" opacity=".6"/>
        <circle cx="25" cy="-42" r="9" fill="#FFA5A5" opacity=".6"/>
        <circle cx="-16" cy="-55" r="4.5" fill="#3A2818"/>
        <circle cx="16" cy="-55" r="4.5" fill="#3A2818"/>
        <ellipse cx="0" cy="-32" rx="14" ry="7" fill="#8B2E2E"/>
      </g>
    </svg>
    <div class="card">
      <h3>🎯 テーマをえらぼう</h3>
      <div class="opt-row theme" id="theme-select">
        <button class="opt-btn active" data-theme="やさい"><span class="emoji">🥕</span>やさい</button>
        <button class="opt-btn" data-theme="くだもの"><span class="emoji">🍎</span>くだもの</button>
        <button class="opt-btn" data-theme="どうぶつ"><span class="emoji">🐰</span>どうぶつ</button>
        <button class="opt-btn" data-theme="なまえ"><span class="emoji">👦</span>こどものなまえ</button>
      </div>
    </div>
    <div class="card">
      <h3>⭐ むずかしさをえらぼう</h3>
      <div class="opt-row level" id="level-select">
        <button class="opt-btn active" data-level="初級">しょきゅう</button>
        <button class="opt-btn" data-level="中級">ちゅうきゅう</button>
        <button class="opt-btn" data-level="上級">じょうきゅう</button>
      </div>
    </div>
    <button class="start-btn" id="start-btn">スタート！</button>
  </div>

  <!-- =============== ゲーム画面 =============== -->
  <div id="game-screen" class="screen hidden">
    <div class="hud">
      <button class="home-btn" id="home-btn">🏠</button>
      <div class="hud-lives" id="lives"></div>
      <div class="score-box"><span class="label">スコア</span><span id="score">0</span></div>
    </div>
    <div class="timer-wrap"><div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div></div>
    <div class="stage">
      <div class="character-area">
        <svg class="character" id="character" viewBox="-100 -120 200 240" style="transform:scale(1)">
          <ellipse cx="0" cy="110" rx="55" ry="7" fill="rgba(0,0,0,.15)"/>
          <g class="char-body">
            <rect x="-22" y="55" width="17" height="42" rx="8" fill="#5B7DC4"/>
            <rect x="5" y="55" width="17" height="42" rx="8" fill="#5B7DC4"/>
            <ellipse cx="-13" cy="100" rx="13" ry="6" fill="#3A2818"/>
            <ellipse cx="13" cy="100" rx="13" ry="6" fill="#3A2818"/>
            <ellipse cx="-55" cy="20" rx="12" ry="28" fill="#FFD9A8" transform="rotate(-15 -55 20)"/>
            <ellipse cx="55" cy="20" rx="12" ry="28" fill="#FFD9A8" transform="rotate(15 55 20)"/>
            <ellipse cx="0" cy="25" rx="60" ry="50" fill="#FFD9A8"/>
            <path d="M -55 25 Q -55 -25 -30 -30 L 30 -30 Q 55 -25 55 25 L 55 60 L -55 60 Z" fill="#FF6B6B"/>
            <ellipse cx="0" cy="40" rx="38" ry="20" fill="#FFD9A8"/>
            <circle cx="0" cy="-55" r="48" fill="#FFD9A8"/>
            <path d="M -42 -70 Q -20 -108 0 -100 Q 20 -108 42 -70 L 32 -55 Q 0 -85 -32 -55 Z" fill="#3A2818"/>
            <circle cx="-25" cy="-42" r="9" fill="#FFA5A5" opacity=".6"/>
            <circle cx="25" cy="-42" r="9" fill="#FFA5A5" opacity=".6"/>
            <g class="eyes-open">
              <circle cx="-16" cy="-55" r="4.5" fill="#3A2818"/>
              <circle cx="16" cy="-55" r="4.5" fill="#3A2818"/>
            </g>
            <g class="eyes-happy">
              <path d="M -22 -55 Q -16 -60 -10 -55" stroke="#3A2818" stroke-width="3" stroke-linecap="round" fill="none"/>
              <path d="M 10 -55 Q 16 -60 22 -55" stroke="#3A2818" stroke-width="3" stroke-linecap="round" fill="none"/>
            </g>
            <ellipse class="mouth" cx="0" cy="-32" rx="14" ry="7" fill="#8B2E2E"/>
          </g>
        </svg>
        <div class="veggie-fly" id="veggie-fly">🥕</div>
      </div>
      <div class="word-area">
        <span class="word-emoji" id="word-emoji">🥕</span>
        <div id="word-display"></div>
        <div class="typed-display" id="typed-display"></div>
      </div>
    </div>

    <!-- キーボード -->
    <div class="keyboard" id="keyboard">
      <button class="key" data-flick="a">あ</button>
      <button class="key" data-flick="ka">か</button>
      <button class="key" data-flick="sa">さ</button>
      <button class="key modifier" data-mod="back">⌫</button>

/* ==================== SE: Web Audio API ==================== */
class SFX{
  constructor(){this.ctx=null;}
  init(){
    if(!this.ctx){
      try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
    }
    if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();
  }
  tone(freq,dur,type='sine',vol=.3,delay=0){
    if(!this.ctx)return;
    const t=this.ctx.currentTime+delay;
    const osc=this.ctx.createOscillator();
    const g=this.ctx.createGain();
    osc.type=type;
    osc.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(.001,t+dur);
    osc.connect(g).connect(this.ctx.destination);
    osc.start(t);osc.stop(t+dur);
  }
  type(){this.tone(700+Math.random()*300,.04,'square',.12);}
  chomp(){
    if(!this.ctx)return;
    const t=this.ctx.currentTime;
    const bs=this.ctx.sampleRate*.12;
    const buf=this.ctx.createBuffer(1,bs,this.ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<bs;i++)d[i]=(Math.random()*2-1)*(1-i/bs)*.6;
    const src=this.ctx.createBufferSource();
    src.buffer=buf;
    const f=this.ctx.createBiquadFilter();
    f.type='lowpass';f.frequency.value=1200;
    const g=this.ctx.createGain();g.gain.value=.5;
    src.connect(f).connect(g).connect(this.ctx.destination);
    src.start(t);
    this.tone(90,.13,'sine',.4);
  }
  clear(){
    const notes=[523,659,784,1047];
    notes.forEach((f,i)=>this.tone(f,.22,'triangle',.32,i*.06));
  }
  fanfare(){
    const notes=[523,659,784,1047,1319,1568];
    notes.forEach((f,i)=>this.tone(f,.3,'triangle',.35,i*.08));
    this.tone(261,.6,'sine',.2,0);
  }
  miss(){
    this.tone(240,.25,'sawtooth',.28);
    this.tone(160,.35,'sawtooth',.28,.12);
  }
  gameover(){
    const notes=[440,415,392,349];
    notes.forEach((f,i)=>this.tone(f,.4,'triangle',.3,i*.18));
  }
}
const sfx=new SFX();

const G={

/* ==================== 画面切替 ==================== */
const $=id=>document.getElementById(id);
function show(id){

$('start-btn').addEventListener('click',()=>{sfx.init();startGame();});

$('retry-btn').addEventListener('click',startGame);
$('totitle-btn').addEventListener('click',()=>show('title-screen'));

/* ==================== ゲーム開始 ==================== */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function startGame(){
  const pool=WORDS[G.theme][G.level].slice();
  G.words=shuffle(pool);
  G.wordIdx=0;
  G.lives=2;
  G.score=0;
  G.eaten=0;
  G.combo=0;
  G.maxCombo=0;
  G.charScale=1;
  G.playing=true;
  $('character').style.transform='scale(1)';
  $('character').classList.remove('happy');
  renderLives();
  renderScore();
  nextWord();
  show('game-screen');
}

/* ==================== 次のお題 ==================== */
function nextWord(){
  if(G.wordIdx>=G.words.length){
    // お題を使い切ったらシャッフルしてループ（ただしゴール数達成で勝利済み）
    G.words=shuffle(G.words);
    G.wordIdx=0;
  }
  G.current=G.words[G.wordIdx++];
  G.typed='';
  G.timeLeft=20;
  $('word-emoji').textContent=G.current.emoji;
  // ふりがな表示
  $('word-display').innerHTML='<ruby>'+escapeHTML(G.current.text)+'<rt>'+escapeHTML(G.current.reading)+'</rt></ruby>';
  renderTyped();
  startTimer();
}

function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function renderTyped(){
  const target=G.current.reading;
  const html=Array.from(target).map((ch,i)=>{
    const t=G.typed[i];
    if(t===undefined)return `<span class="typed-char">・</span>`;
    if(t===ch)return `<span class="typed-char filled">${t}</span>`;
    return `<span class="typed-char wrong">${t}</span>`;
  }).join('');
  $('typed-display').innerHTML=html;
}
function renderLives(){
  const el=$('lives');
  el.innerHTML='';
  for(let i=0;i<2;i++){
    const h=document.createElement('div');
    h.className='heart'+(i>=G.lives?' lost':'');
    el.appendChild(h);
  }
}
function renderScore(){$('score').textContent=G.score;}

/* ==================== タイマー ==================== */
function startTimer(){
  stopTimer();
  const start=performance.now();
  const dur=20000;
  G.timerId=setInterval(()=>{
    const elapsed=performance.now()-start;
    G.timeLeft=Math.max(0,(dur-elapsed)/1000);
    $('timer-fill').style.width=(G.timeLeft/20*100)+'%';
    if(G.timeLeft<=0){
      stopTimer();
      handleMiss(true);
    }
  },50);
}
function stopTimer(){if(G.timerId){clearInterval(G.timerId);G.timerId=null;}}

/* ==================== 入力処理 ==================== */
function inputKana(kana){
  if(!G.playing)return;
  const target=G.current.reading;
  const idx=G.typed.length;
  // 明らかな誤り（濁点で救えない = か行/さ行/た行/は行/母音以外）を弾いてキッズフレンドリー化
  const canBeModified=k=>DAKUTEN[k]||HANDAKU[k]||SMALL[k];
  if(kana!==target[idx]&&!canBeModified(kana)){
    // ミス扱いにはせず、シェイクだけ
    sfx.miss();
    $('typed-display').animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:250});
    return;
  }
  sfx.type();
  G.typed+=kana;
  renderTyped();
  checkAnswer();
}

function applyModifier(kind){
  if(!G.playing||G.typed.length===0)return;
  const last=G.typed[G.typed.length-1];
  const rest=G.typed.slice(0,-1);
  let neu=last;
  if(kind==='dakuten'){
    if(DAKUTEN[last])neu=DAKUTEN[last];
    else if(DAKU_REV[last])neu=DAKU_REV[last];
    else if(HANDAKU_REV[last])neu=DAKUTEN[HANDAKU_REV[last]]||last;
  }else if(kind==='handakuten'){
    if(HANDAKU[last])neu=HANDAKU[last];
    else if(HANDAKU_REV[last])neu=HANDAKU_REV[last];
    else if(DAKU_REV[last])neu=HANDAKU[DAKU_REV[last]]||last;
  }else if(kind==='small'){
    if(SMALL[last])neu=SMALL[last];
    else if(SMALL_REV[last])neu=SMALL_REV[last];
  }
  if(neu!==last){
    sfx.type();
    G.typed=rest+neu;
    renderTyped();
    checkAnswer();
  }
}

function backspace(){
  if(!G.playing||G.typed.length===0)return;
  G.typed=G.typed.slice(0,-1);
  sfx.type();
  renderTyped();
}
function clearInput(){
  if(!G.playing)return;
  G.typed='';
  renderTyped();
}

function checkAnswer(){
  const target=G.current.reading;
  if(G.typed===target){
    stopTimer();
    handleClear();
  }else if(G.typed.length>=target.length||!target.startsWith(G.typed)){
    // 途中で間違えた or 長さ超過 → 少し猶予（消してもらう）
    // ここではミス扱いにはせず、視覚フィードバックのみ
  }
}

/* ==================== クリア処理 ==================== */
function handleClear(){
  G.playing=false;
  G.eaten++;
  G.combo++;
  G.maxCombo=Math.max(G.maxCombo,G.combo);
  // スコア: 残り時間ボーナス + コンボ倍率
  const base=100;
  const timeBonus=Math.floor(G.timeLeft*10);
  const comboMul=1+Math.min(G.combo-1,9)*.2;
  const gain=Math.floor((base+timeBonus)*comboMul);
  G.score+=gain;
  renderScore();

  // ガブっアニメ
  const veg=$('veggie-fly');
  veg.textContent=G.current.emoji;
  veg.classList.remove('launch');
  void veg.offsetWidth;
  veg.classList.add('launch');

  const ch=$('character');
  setTimeout(()=>{
    ch.classList.add('chomp','happy');
    sfx.chomp();
  },320);
  setTimeout(()=>{
    ch.classList.remove('chomp');
    // シュリンク
    G.charScale=Math.max(.55,1-G.eaten*.045);
    ch.style.transform=`scale(${G.charScale})`;
    flashScreen();
    popText(G.combo>=5?'GREAT!':G.combo>=3?'NICE!':'GOOD!');
    confettiBurst();
    sfx.clear();
  },560);
  setTimeout(()=>{
    ch.classList.remove('happy');
    // ゴール判定
    if(G.eaten>=G.goalCount){
      showResult(true);
    }else{
      G.playing=true;
      nextWord();
    }
  },1400);
}

/* ==================== ミス処理 ==================== */
function handleMiss(timeout){
  G.playing=false;
  G.lives--;
  G.combo=0;
  renderLives();
  sfx.miss();
  // 画面を軽く揺らす
  $('game-screen').animate([
    {transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}
  ],{duration:300});
  if(timeout)popText('じかんぎれ！');
  setTimeout(()=>{
    if(G.lives<=0){
      showResult(false);
    }else{
      G.playing=true;
      nextWord();
    }
  },900);
}

/* ==================== エフェクト ==================== */
function flashScreen(){
  const f=$('fx-flash');
  f.classList.remove('active');void f.offsetWidth;f.classList.add('active');
}
function popText(txt){
  const p=document.createElement('div');
  p.className='fx-text pop';
  p.textContent=txt;
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),1000);
}
function confettiBurst(){
  const colors=['#FF6B6B','#FFD93D','#7AC74F','#4D96FF','#FF8C42','#B983FF'];
  for(let i=0;i<28;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.background=colors[i%colors.length];
    c.style.left=(Math.random()*100)+'vw';
    c.style.top='-20px';
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);
    const dx=(Math.random()-.5)*200;
    const dy=window.innerHeight*.7+Math.random()*200;
    c.animate([
      {transform:`translate(0,0) rotate(0)`,opacity:1},
      {transform:`translate(${dx}px,${dy}px) rotate(${720+Math.random()*360}deg)`,opacity:0}
    ],{duration:1200+Math.random()*400,easing:'cubic-bezier(.3,.7,.5,1)'});
    setTimeout(()=>c.remove(),1700);
  }
}

/* ==================== 結果画面 ==================== */
function showResult(win){
  stopTimer();
  G.playing=false;
  $('gameover-title').textContent=win?'クリア！ 🎉':'ゲームオーバー';
  $('stat-eaten').textContent=G.eaten+'こ';
  $('stat-score').textContent=G.score;
  $('stat-combo').textContent=G.maxCombo;
  // キャラクターの変化状態を表示
  const goSvg=$('gameover-char');
  goSvg.innerHTML=$('character').innerHTML;
  goSvg.setAttribute('viewBox','-100 -120 200 240');
  const finalScale=win?.55:G.charScale;
  goSvg.style.transform=`scale(${finalScale})`;
  goSvg.style.transformOrigin='center';
  if(win){
    const eo=goSvg.querySelector('.eyes-open');if(eo)eo.style.opacity='0';
    const eh=goSvg.querySelector('.eyes-happy');if(eh)eh.style.opacity='1';
  }
  show('gameover-screen');
  if(win)sfx.fanfare();else sfx.gameover();
}

/* ==================== フリック入力（コア） ==================== */
const popup=$('flick-popup');
let currentTouch=null;

function getDirection(dx,dy){
  const dist=Math.hypot(dx,dy);
  if(dist<25)return 'c';
  const ang=Math.atan2(dy,dx)*180/Math.PI;
  if(ang>-45&&ang<=45)return 'r';
  if(ang>45&&ang<=135)return 'd';
  if(ang>-135&&ang<=-45)return 'u';
  return 'l';
}

function showPopup(btn,map,cx,cy){
  popup.innerHTML=`
    <div class="flick-cell u ${map.u?'':'empty'}" data-dir="u">${map.u||''}</div>
    <div class="flick-cell l ${map.l?'':'empty'}" data-dir="l">${map.l||''}</div>
    <div class="flick-cell c" data-dir="c">${map.c||''}</div>
    <div class="flick-cell r ${map.r?'':'empty'}" data-dir="r">${map.r||''}</div>
    <div class="flick-cell d ${map.d?'':'empty'}" data-dir="d">${map.d||''}</div>
  `;
  const rect=btn.getBoundingClientRect();
  popup.style.left=(rect.left+rect.width/2)+'px';
  popup.style.top=(rect.top-70)+'px';
  popup.classList.add('active');
}
function updatePopupDir(dir){
  popup.querySelectorAll('.flick-cell').forEach(c=>{
    c.classList.toggle('highlight',c.dataset.dir===dir&&!c.classList.contains('empty'));
  });
}
function hidePopup(){popup.classList.remove('active');}

function attachFlick(btn){
  const key=btn.dataset.flick;
  const map=FLICK[key];
  if(!map)return;

  const start=(x,y)=>{
    sfx.init();
    currentTouch={x,y,btn,map};
    btn.classList.add('pressed');
    showPopup(btn,map,x,y);
    updatePopupDir('c');
  };
  const move=(x,y)=>{
    if(!currentTouch||currentTouch.btn!==btn)return;
    const dir=getDirection(x-currentTouch.x,y-currentTouch.y);
    updatePopupDir(dir);
  };
  const end=(x,y)=>{
    if(!currentTouch||currentTouch.btn!==btn)return;
    const dir=getDirection(x-currentTouch.x,y-currentTouch.y);
    const kana=map[dir]||map.c;
    if(kana&&kana!=='')inputKana(kana);
    hidePopup();
    btn.classList.remove('pressed');
    currentTouch=null;
  };

  btn.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];start(t.clientX,t.clientY);},{passive:false});
  btn.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];move(t.clientX,t.clientY);},{passive:false});
  btn.addEventListener('touchend',e=>{e.preventDefault();const t=e.changedTouches[0];end(t.clientX,t.clientY);},{passive:false});
  btn.addEventListener('touchcancel',e=>{hidePopup();btn.classList.remove('pressed');currentTouch=null;},{passive:false});

  // PCデバッグ用マウス対応
  btn.addEventListener('mousedown',e=>{e.preventDefault();start(e.clientX,e.clientY);});
  document.addEventListener('mousemove',e=>{if(currentTouch)move(e.clientX,e.clientY);});
  document.addEventListener('mouseup',e=>{if(currentTouch){const b=currentTouch.btn;end(e.clientX,e.clientY);}});
}

/* すべてのフリックキーに設定 */
document.querySelectorAll('.key[data-flick]').forEach(attachFlick);

/* モディファイアキー（濁点、半濁点、小、⌫、クリア） */
document.querySelectorAll('.key[data-mod]').forEach(btn=>{
  const mod=btn.dataset.mod;
  const press=e=>{
    e.preventDefault();
    sfx.init();
    btn.classList.add('pressed');
    if(mod==='back')backspace();
    else if(mod==='clear')clearInput();
    else applyModifier(mod);
  };
  const release=()=>btn.classList.remove('pressed');
  btn.addEventListener('touchstart',press,{passive:false});
  btn.addEventListener('touchend',e=>{e.preventDefault();release();},{passive:false});
  btn.addEventListener('mousedown',press);
  btn.addEventListener('mouseup',release);
  btn.addEventListener('mouseleave',release);
});

/* ダブルタップズーム抑止 */
let lastTouch=0;
document.addEventListener('touchend',e=>{
  const now=Date.now();
  if(now-lastTouch<300)e.preventDefault();
  lastTouch=now;
},{passive:false});

/* iOS のスクロールバウンス抑止 */
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});

/* 初期表示 */
show('title-screen');
</script>
