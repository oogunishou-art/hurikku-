<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7AC74F">
<title>やさいをたべてスリムになろう！</title>
<style>
:root{
  --bg-sky:#B5E6FF;--bg-grass:#7AC74F;--cream:#FFF8E7;--carrot:#FF8C42;
  --tomato:#E74C3C;--leaf:#4CAF50;--eggplant:#8B5A9E;--text:#3A2818;
  --shadow:rgba(58,40,24,.18);--key-face:#FFF8E7;--key-shadow:#C9B99A;
  --key-modifier:#FFB347;--key-modifier-shadow:#C77A1F;--heart:#E74C3C;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
html,body{height:100%;overflow:hidden;font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Yu Gothic",sans-serif;color:var(--text);background:linear-gradient(180deg,var(--bg-sky) 0%,var(--bg-sky) 55%,var(--bg-grass) 55%,var(--bg-grass) 100%);touch-action:manipulation;overscroll-behavior:none;}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-bottom:var(--safe-bottom);}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;z-index:10;overflow-y:auto;}
.hidden{display:none!important;}
.title-logo{font-size:clamp(22px,6vw,38px);font-weight:900;color:#fff;text-shadow:0 4px 0 var(--eggplant),0 8px 12px rgba(0,0,0,.2);text-align:center;line-height:1.2;margin-bottom:6px;letter-spacing:.02em;}
.title-sub{font-size:13px;background:var(--cream);padding:4px 12px;border-radius:999px;box-shadow:0 3px 0 var(--key-shadow);margin-bottom:8px;}
.title-char{width:120px;height:120px;margin-bottom:8px;animation:idleBounce 1.6s ease-in-out infinite;}
.card{background:var(--cream);border-radius:16px;padding:12px;box-shadow:0 5px 0 var(--key-shadow),0 10px 18px rgba(0,0,0,.15);width:min(360px,92vw);margin-bottom:8px;}
.card h3{font-size:13px;margin-bottom:7px;color:var(--eggplant);display:flex;align-items:center;gap:5px;}
.opt-row{display:grid;gap:5px;}
.opt-row.device{grid-template-columns:1fr 1fr;}
.opt-row.theme{grid-template-columns:1fr 1fr 1fr;}
.opt-row.level{grid-template-columns:1fr 1fr 1fr;}
.opt-btn{background:#fff;border:3px solid var(--key-shadow);border-radius:10px;padding:8px 4px;font-size:12px;font-weight:700;color:var(--text);cursor:pointer;transition:transform .1s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:46px;font-family:inherit;}
.opt-btn .emoji{font-size:17px;pointer-events:none;}
.opt-btn *{pointer-events:none;}
.opt-btn.active{background:var(--carrot);border-color:var(--carrot);color:#fff;box-shadow:0 3px 0 #B8551A;transform:translateY(-1px);}
.start-btn{background:var(--tomato);color:#fff;border:none;border-radius:999px;padding:13px 32px;font-size:19px;font-weight:900;box-shadow:0 5px 0 #8B2E2E,0 8px 18px rgba(0,0,0,.2);cursor:pointer;letter-spacing:.05em;font-family:inherit;}
.start-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8B2E2E;}

/* ===== 体型ゲージ ===== */
.body-gauge-wrap{padding:3px 12px 2px;display:flex;flex-direction:column;gap:2px;}
.body-gauge-label{font-size:10px;font-weight:900;color:var(--cream);text-shadow:0 1px 2px rgba(0,0,0,.3);display:flex;justify-content:space-between;align-items:center;}
.body-gauge-bar{height:16px;background:rgba(255,255,255,.35);border-radius:999px;overflow:hidden;border:2px solid rgba(255,255,255,.6);box-shadow:inset 0 2px 4px rgba(0,0,0,.15);position:relative;}
.body-gauge-fill{height:100%;border-radius:999px;transition:width .45s cubic-bezier(.34,1.56,.64,1);background:linear-gradient(90deg,#7AC74F,#A8E063);}
.body-gauge-fill.muscle{background:linear-gradient(90deg,#FF6B35,#FF8C42,#FFD93D);}
.stage-badge{font-size:10px;background:var(--cream);border-radius:999px;padding:1px 7px;font-weight:900;color:var(--eggplant);}

/* ===== HUD ===== */
#game-screen{display:flex;flex-direction:column;width:100%;height:100%;}
.hud{display:flex;align-items:center;justify-content:space-between;padding:5px 12px;gap:8px;}
.hud-lives{display:flex;gap:4px;}
.heart{width:24px;height:24px;background:var(--heart);-webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 21s-7-4.5-9.5-9C.7 8.5 3 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6.3 4.5 4.5 8-2.5 4.5-9.5 9-9.5 9z'/></svg>") center/contain no-repeat;mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 21s-7-4.5-9.5-9C.7 8.5 3 4 7 4c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6.3 4.5 4.5 8-2.5 4.5-9.5 9-9.5 9z'/></svg>") center/contain no-repeat;filter:drop-shadow(0 2px 0 #8B2E2E);}
.heart.lost{background:#999;filter:none;opacity:.4;}
.score-box{background:var(--cream);padding:4px 11px;border-radius:999px;font-weight:900;font-size:14px;box-shadow:0 3px 0 var(--key-shadow);display:flex;align-items:center;gap:5px;}
.score-box .label{font-size:10px;color:#888;}
.home-btn{background:var(--cream);border:none;width:34px;height:34px;border-radius:50%;font-size:16px;box-shadow:0 3px 0 var(--key-shadow);cursor:pointer;font-family:inherit;}
.timer-wrap{padding:0 12px 2px;}
.timer-bar{height:11px;background:rgba(255,255,255,.5);border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.15);border:2px solid var(--cream);}
.timer-fill{height:100%;background:linear-gradient(90deg,#7AC74F,#FFD93D 60%,#E74C3C);transition:width .2s linear;border-radius:999px;}

/* ===== ステージ ===== */
.stage{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:3px 12px 2px;overflow:hidden;}
.character-area{position:relative;width:100%;max-width:340px;flex:0 0 auto;display:flex;justify-content:center;align-items:center;height:30vh;min-height:150px;max-height:210px;}
.character{width:100%;height:100%;transition:transform .9s cubic-bezier(.34,1.56,.64,1);transform-origin:center 78%;filter:drop-shadow(0 8px 12px rgba(0,0,0,.18));}
.character.chomp .mouth-smile{opacity:0;}
.character.chomp .mouth-open{animation:mouthOpen .55s ease-out;}
.character.chomp .char-body{animation:bodyBounce .55s ease-out;}
.mouth-smile{transition:opacity .1s;}
.character.happy .eyes-open{opacity:0;}
.character.happy .eyes-happy{opacity:1;}
.eyes-happy{opacity:0;transition:opacity .12s;}
.eyes-open{transition:opacity .12s;}
@keyframes bodyPop{0%{filter:drop-shadow(0 8px 12px rgba(0,0,0,.18)) brightness(1);}30%{filter:drop-shadow(0 10px 20px rgba(255,200,0,.9)) brightness(1.5);}60%{filter:drop-shadow(0 8px 12px rgba(0,0,0,.18)) brightness(1.1);}100%{filter:drop-shadow(0 8px 12px rgba(0,0,0,.18)) brightness(1);}}
.character.body-change{animation:bodyPop .8s ease-out;}
@keyframes mouthOpen{0%{rx:2;ry:2;opacity:0;}20%{rx:30;ry:30;opacity:1;}55%{rx:22;ry:16;opacity:1;}100%{rx:2;ry:2;opacity:0;}}
@keyframes bodyBounce{0%,100%{transform:translateY(0);}30%{transform:translateY(-10px);}60%{transform:translateY(5px);}}
@keyframes idleBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.veggie-fly{position:absolute;font-size:50px;left:80%;top:20%;pointer-events:none;z-index:5;}
.veggie-fly.launch{animation:veggieFly .55s cubic-bezier(.5,-.2,.7,.5) forwards;}
@keyframes veggieFly{0%{left:80%;top:20%;transform:scale(1.4) rotate(0);opacity:1;}70%{left:52%;top:38%;transform:scale(1.1) rotate(360deg);opacity:1;}100%{left:50%;top:44%;transform:scale(.2) rotate(720deg);opacity:0;}}
.word-area{background:var(--cream);border-radius:18px;padding:9px 16px 11px;box-shadow:0 4px 0 var(--key-shadow),0 10px 18px rgba(0,0,0,.15);width:calc(100% - 8px);max-width:380px;margin-top:auto;margin-bottom:3px;text-align:center;}
.word-emoji{font-size:28px;display:block;margin-bottom:1px;}
ruby{font-size:clamp(22px,6.5vw,36px);font-weight:900;line-height:1.1;ruby-align:center;}
rt{font-size:.42em;color:var(--eggplant);font-weight:700;letter-spacing:.1em;}
.typed-display{margin-top:4px;font-size:20px;font-weight:900;letter-spacing:.15em;min-height:26px;display:flex;justify-content:center;gap:2px;flex-wrap:wrap;}
.typed-char{display:inline-block;min-width:20px;padding:0 3px;border-bottom:3px solid var(--key-shadow);color:#ccc;transition:color .1s,border-color .1s;}
.typed-char.filled{color:var(--leaf);border-color:var(--leaf);}
.typed-char.wrong{color:var(--tomato);border-color:var(--tomato);animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}

/* ===== iPhone キーボード ===== */
.keyboard{flex:0 0 auto;background:linear-gradient(180deg,#D8CBA8,#B8A87F);padding:4px 4px calc(4px + var(--safe-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:500px;width:100%;margin:0 auto;box-shadow:inset 0 3px 4px rgba(0,0,0,.15);}
.key{background:var(--key-face);border:none;border-radius:9px;height:48px;font-size:20px;font-weight:900;color:var(--text);box-shadow:0 3px 0 var(--key-shadow);cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-touch-callout:none;font-family:inherit;}
.key.modifier{background:var(--key-modifier);color:#fff;box-shadow:0 3px 0 var(--key-modifier-shadow);font-size:15px;}
.key.modifier.small-mod{font-size:12px;}
.key.modifier.cycle-mod{display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1;padding:4px 0;gap:1px;background:linear-gradient(180deg,#FFB347,#FF9F2E);}
.key.modifier.cycle-mod span{font-size:11px;font-weight:900;display:block;}
.key-spacer{visibility:hidden;pointer-events:none;}
.key.pressed{transform:translateY(2px);box-shadow:0 1px 0 var(--key-shadow);}
.key.modifier.pressed{box-shadow:0 1px 0 var(--key-modifier-shadow);}

/* ===== Android キーボード ===== */
.keyboard-android{flex:0 0 auto;background:linear-gradient(180deg,#3C3C3E,#2C2C2E);padding:0 3px calc(4px + var(--safe-bottom));display:flex;flex-direction:column;gap:0;max-width:500px;width:100%;margin:0 auto;}
.android-toolbar{background:#2C2C2E;padding:4px 8px;display:flex;gap:5px;align-items:center;border-top:1px solid #3C3C3E;}
.android-tool-btn{background:#4A4A4C;border:none;border-radius:6px;padding:4px 9px;color:#fff;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;}
.android-speed-hint{margin-left:auto;font-size:9px;color:#888;}
.android-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:3px;}
.key-android{background:#4A4A4C;border:none;border-radius:8px;height:54px;font-size:14px;font-weight:700;color:#fff;box-shadow:0 3px 0 #1A1A1C;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;-webkit-touch-callout:none;font-family:inherit;gap:0;padding:2px 0;}
.key-android .main-kana{font-size:18px;font-weight:900;line-height:1.1;}
.key-android .sub-nums{font-size:8px;color:#AAA;letter-spacing:.4px;line-height:1.2;}
.key-android.mod-android{background:#5A3D7A;font-size:12px;}
.key-android.back-android{background:#5A3D7A;font-size:21px;}
.key-android.enter-android{background:#2E7D32;font-size:12px;font-weight:900;line-height:1.3;}
.key-android.spacer-android{background:transparent;box-shadow:none;pointer-events:none;visibility:hidden;}
.key-android.pressed{transform:translateY(2px);box-shadow:0 1px 0 #1A1A1C;opacity:.85;}

/* ===== フリックポップアップ ===== */
.flick-popup{position:fixed;pointer-events:none;z-index:100;width:176px;height:176px;display:none;transform:translate(-50%,-50%);}
.flick-popup.active{display:block;}
.flick-cell{position:absolute;width:56px;height:56px;background:var(--cream);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900;color:var(--text);box-shadow:0 4px 8px rgba(0,0,0,.25);border:2px solid var(--key-shadow);}
.flick-cell.c{left:50%;top:50%;transform:translate(-50%,-50%);}
.flick-cell.u{left:50%;top:0;transform:translateX(-50%);}
.flick-cell.d{left:50%;bottom:0;transform:translateX(-50%);}
.flick-cell.l{left:0;top:50%;transform:translateY(-50%);}
.flick-cell.r{right:0;top:50%;transform:translateY(-50%);}
.flick-cell.highlight{background:var(--carrot);color:#fff;border-color:var(--carrot);transform:translate(-50%,-50%) scale(1.15);}
.flick-cell.u.highlight,.flick-cell.d.highlight{transform:translateX(-50%) scale(1.15);}
.flick-cell.l.highlight,.flick-cell.r.highlight{transform:translateY(-50%) scale(1.15);}
.flick-cell.empty{opacity:0;}

/* ===== エフェクト ===== */
.fx-flash{position:fixed;inset:0;background:radial-gradient(circle,rgba(255,220,100,.7),transparent 60%);pointer-events:none;z-index:20;opacity:0;}
.fx-flash.active{animation:flash .4s ease-out;}
@keyframes flash{0%{opacity:0;}30%{opacity:1;}100%{opacity:0;}}
.fx-text{position:fixed;top:35%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:58px;font-weight:900;color:#fff;text-shadow:0 4px 0 var(--tomato),0 6px 12px rgba(0,0,0,.4);pointer-events:none;z-index:30;white-space:nowrap;font-style:italic;letter-spacing:.03em;}
.fx-text.pop{animation:pop .9s ease-out forwards;}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg);opacity:0;}30%{transform:translate(-50%,-50%) scale(1.3) rotate(-8deg);opacity:1;}50%{transform:translate(-50%,-50%) scale(1) rotate(-8deg);}100%{transform:translate(-50%,-70%) scale(1.1) rotate(-8deg);opacity:0;}}
.confetti{position:fixed;top:0;width:10px;height:14px;pointer-events:none;z-index:25;}

/* ===== 結果 ===== */
.over-title{font-size:38px;font-weight:900;color:#fff;text-shadow:0 5px 0 var(--eggplant),0 10px 15px rgba(0,0,0,.3);margin-bottom:8px;text-align:center;}
.stat-row{display:flex;justify-content:space-between;padding:7px 4px;font-size:15px;font-weight:700;border-bottom:2px dashed var(--key-shadow);}
.stat-row:last-child{border-bottom:none;}
.stat-row .val{color:var(--carrot);}
.btn-row{display:flex;gap:10px;margin-top:8px;}
.sec-btn{background:var(--cream);border:3px solid var(--eggplant);color:var(--eggplant);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:900;box-shadow:0 4px 0 var(--eggplant);cursor:pointer;font-family:inherit;}
.sec-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--eggplant);}
input.name-input{font-family:inherit;font-size:21px;font-weight:900;padding:10px 13px;border:3px solid var(--eggplant);border-radius:11px;text-align:center;width:100%;max-width:250px;background:#fff;color:var(--text);letter-spacing:.15em;-webkit-user-select:text;user-select:text;outline:none;}
input.name-input:focus{border-color:var(--carrot);box-shadow:0 0 0 4px rgba(255,140,66,.2);}
.rank-tabs{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin-bottom:8px;width:min(360px,92vw);}
.rank-tab{background:#fff;border:2px solid var(--key-shadow);color:var(--text);border-radius:999px;padding:4px 9px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
.rank-tab.active{background:var(--eggplant);color:#fff;border-color:var(--eggplant);}
.ranking-list{background:var(--cream);border-radius:16px;padding:9px;width:min(360px,92vw);max-height:50vh;overflow-y:auto;box-shadow:0 4px 0 var(--key-shadow),0 10px 18px rgba(0,0,0,.15);-webkit-user-select:auto;user-select:auto;}
.rank-row{display:grid;grid-template-columns:34px 1fr auto;gap:7px;padding:7px 5px;border-bottom:2px dashed var(--key-shadow);align-items:center;}
.rank-row:last-child{border-bottom:none;}
.rank-row.highlight{background:#FFF4C4;border-radius:8px;box-shadow:inset 0 0 0 2px var(--carrot);animation:rankFlash 1s ease-in-out;}
@keyframes rankFlash{0%,100%{background:#FFF4C4;}50%{background:#FFE87C;}}
.rank-medal{font-size:19px;text-align:center;font-weight:900;}
.rank-name-block{display:flex;flex-direction:column;gap:2px;min-width:0;}
.rank-name{font-size:14px;font-weight:900;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rank-meta{font-size:9px;color:#888;}
.rank-score{font-size:16px;font-weight:900;color:var(--carrot);text-align:right;}
.rank-score .unit{font-size:9px;color:#888;margin-left:2px;}
.empty-rank{text-align:center;padding:24px 18px;color:#888;font-size:13px;line-height:1.8;}
@media(max-height:660px){.title-char{width:90px;height:90px;}.character-area{height:26vh;min-height:130px;}.key{height:42px;}.key-android{height:48px;}}
</style>
</head>
<body>
<div id="app">

<!-- ======== タイトル画面 ======== -->
<div id="title-screen" class="screen">
  <div class="title-logo">やさいをたべて<br>スリムになろう！</div>
  <div class="title-sub">🥕 フリックにゅうりょくゲーム 🥦</div>
  <svg class="title-char" viewBox="-130 -160 260 320">
    <defs>
      <radialGradient id="skinT" cx="35%" cy="35%" r="70%"><stop offset="0%" stop-color="#FFE4C4"/><stop offset="100%" stop-color="#F5C29A"/></radialGradient>
      <radialGradient id="cheekT" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FF8FA6" stop-opacity="1"/><stop offset="100%" stop-color="#FF8FA6" stop-opacity="0"/></radialGradient>
    </defs>
    <ellipse cx="0" cy="148" rx="80" ry="9" fill="rgba(0,0,0,.18)"/>
    <g>
      <ellipse cx="-32" cy="128" rx="17" ry="24" fill="url(#skinT)"/>
      <ellipse cx="32" cy="128" rx="17" ry="24" fill="url(#skinT)"/>

      <circle cx="96" cy="44" r="15" fill="url(#skinT)"/>
      <path d="M -72 28 Q -78 -22 -50 -30 L -38 -30 Q -34 -20 0 -18 Q 34 -20 38 -30 L 50 -30 Q 78 -22 72 28 L 80 102 Q 40 110 0 108 Q -40 110 -80 102 Z" fill="#4ECDC4"/>

      <circle cx="0" cy="-82" r="68" fill="url(#skinT)"/>

      <path d="M -68 -95 Q -75 -148 -30 -155 Q -10 -162 10 -162 Q 30 -155 68 -148 Q 75 -95 66 -78 Q 44 -118 20 -110 Q 0 -115 -20 -110 Q -44 -118 -66 -78 Z" fill="#3A2818"/>
      <path d="M -36 -128 Q -20 -145 0 -140 Q 20 -145 36 -128 Q 20 -122 0 -126 Q -20 -122 -36 -128 Z" fill="#4A382E"/>
      <ellipse cx="-44" cy="-70" rx="17" ry="13" fill="url(#cheekT)"/>
      <ellipse cx="44" cy="-70" rx="17" ry="13" fill="url(#cheekT)"/>
      <path d="M -36 -100 Q -22 -108 -10 -100" stroke="#3A2818" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M 10 -100 Q 22 -108 36 -100" stroke="#3A2818" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <ellipse cx="-22" cy="-82" rx="10" ry="13" fill="#FFF"/>
      <ellipse cx="22" cy="-82" rx="10" ry="13" fill="#FFF"/>
      <ellipse cx="-20" cy="-80" rx="7" ry="10" fill="#3A2818"/>
      <ellipse cx="24" cy="-80" rx="7" ry="10" fill="#3A2818"/>
      <circle cx="-18" cy="-84" r="3" fill="#FFF"/>

/* ======== SE ======== */
class SFX{
  constructor(){this.ctx=null;}
  init(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();}
  tone(freq,dur,type='sine',vol=.3,delay=0){if(!this.ctx)return;const t=this.ctx.currentTime+delay;const osc=this.ctx.createOscillator();const g=this.ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);osc.connect(g).connect(this.ctx.destination);osc.start(t);osc.stop(t+dur);}
  type(){this.tone(700+Math.random()*300,.04,'square',.12);}
  chomp(){if(!this.ctx)return;const t=this.ctx.currentTime;const bs=this.ctx.sampleRate*.12;const buf=this.ctx.createBuffer(1,bs,this.ctx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<bs;i++)d[i]=(Math.random()*2-1)*(1-i/bs)*.6;const src=this.ctx.createBufferSource();src.buffer=buf;const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=1200;const g=this.ctx.createGain();g.gain.value=.5;src.connect(f).connect(g).connect(this.ctx.destination);src.start(t);this.tone(90,.13,'sine',.4);}
  clear(){[523,659,784,1047].forEach((f,i)=>this.tone(f,.22,'triangle',.32,i*.06));}
  fanfare(){[523,659,784,1047,1319,1568].forEach((f,i)=>this.tone(f,.3,'triangle',.35,i*.08));this.tone(261,.6,'sine',.2,0);}
  miss(){this.tone(240,.25,'sawtooth',.28);this.tone(160,.35,'sawtooth',.28,.12);}
  gameover(){[440,415,392,349].forEach((f,i)=>this.tone(f,.4,'triangle',.3,i*.18));}
  levelup(){[523,659,784,1047,1319].forEach((f,i)=>this.tone(f,.16,'triangle',.38,i*.045));}
}
const sfx=new SFX();

const $=id=>document.getElementById(id);
function show(id){['title-screen','game-screen','gameover-screen','name-input-screen','ranking-screen'].forEach(s=>$(s).classList.add('hidden'));$(id).classList.remove('hidden');}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function onTap(el,fn){let f=false;const w=e=>{if(f)return;f=true;setTimeout(()=>f=false,350);fn(e);};el.addEventListener('pointerup',w);el.addEventListener('click',w);}

/* ======== ランキング ======== */
const REC_KEY='yasai-slim-v3';
let currentFilter='all';
function loadRecords(){try{return JSON.parse(localStorage.getItem(REC_KEY)||'[]');}catch(e){return[];}}
function saveRecords(r){try{localStorage.setItem(REC_KEY,JSON.stringify(r));return true;}catch(e){return false;}}
function addRecord(rec){const r=loadRecords();r.push(rec);r.sort((a,b)=>b.score-a.score);if(r.length>30)r.length=30;return saveRecords(r);}
function fmtDate(iso){try{const d=new Date(iso);return`${d.getMonth()+1}/${d.getDate()}`;}catch(e){return'';}}
function showRanking(hi){currentFilter='all';document.querySelectorAll('.rank-tab').forEach(t=>t.classList.toggle('active',t.dataset.filter==='all'));renderRanking(hi);show('ranking-screen');}
function renderRanking(hi){
  const all=loadRecords();
  const recs=currentFilter==='all'?all:all.filter(r=>r.theme===currentFilter);
  const el=$('ranking-list');
  if(!recs.length){el.innerHTML='<div class="empty-rank">まだ きろくがないよ！<br>あそんで きろくを のこそう 🥕</div>';return;}
  const m=['🥇','🥈','🥉'];
  el.innerHTML=recs.slice(0,20).map((r,i)=>{
    const medal=m[i]||`<span>${i+1}</span>`;
    const h=r.id===hi?' highlight':'';
    return`<div class="rank-row${h}"><div class="rank-medal">${medal}</div><div class="rank-name-block"><div class="rank-name">${escapeHTML(r.name||'ゲスト')}</div><div class="rank-meta">${escapeHTML(r.theme)}・${escapeHTML(r.level)}　${fmtDate(r.date)}</div></div><div class="rank-score">${r.score}<span class="unit">pt</span></div></div>`;
  }).join('');
  if(hi){setTimeout(()=>{const e=el.querySelector('.highlight');if(e)e.scrollIntoView({behavior:'smooth',block:'center'});},200);}
}
document.querySelectorAll('.rank-tab').forEach(t=>onTap(t,()=>{document.querySelectorAll('.rank-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');currentFilter=t.dataset.filter;renderRanking();}));
function goToNameInput(){G.pendingRecord={theme:G.theme,level:G.level,score:G.score,eaten:G.eaten,combo:G.maxCombo,date:new Date().toISOString()};$('ni-eaten').textContent=G.eaten;$('ni-score').textContent=G.score;$('ni-meta').textContent=`${G.theme}・${G.level}`;$('name-input').value='';show('name-input-screen');setTimeout(()=>{try{$('name-input').focus();}catch(e){}},300);}
function saveAndRanking(){let n=($('name-input').value||'').trim();if(!n)n='ゲスト';if(n.length>8)n=n.slice(0,8);const id=Date.now()+'-'+Math.random().toString(36).slice(2,7);addRecord({...G.pendingRecord,name:n,id});showRanking(id);}
onTap($('ranking-btn'),()=>{sfx.init();showRanking();});
onTap($('save-record-nav-btn'),goToNameInput);
onTap($('save-record-btn'),saveAndRanking);
onTap($('skip-record-btn'),()=>show('title-screen'));
onTap($('ranking-back-btn'),()=>show('title-screen'));
$('name-input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();saveAndRanking();}});

/* ======== キーボード切替 ======== */
function switchKeyboard(device){$('keyboard-iphone').classList.toggle('hidden',device!=='iphone');$('keyboard-android').classList.toggle('hidden',device==='iphone');}

/* ======== ゲーム開始 ======== */
function startGame(){
  const pool=WORDS[G.theme][G.level].slice();
  G.words=shuffle(pool);G.wordIdx=0;G.lives=2;G.score=0;G.eaten=0;G.combo=0;G.maxCombo=0;G.bodyStage=0;G.playing=true;
  const ch=$('character');
  ch.style.transform='scale(1.05,1)';ch.classList.remove('happy','body-change');
  ch.querySelector('.muscle-arms').style.opacity='0';
  ch.querySelector('.eyes-cool').style.opacity='0';
  ch.querySelector('.eyes-open').style.opacity='1';
  ch.querySelector('.mouth-cool').style.opacity='0';
  ch.querySelector('.mouth-smile').style.opacity='1';
  renderLives();renderScore();updateBodyGauge(0,false);
  switchKeyboard(G.device);nextWord();show('game-screen');
}

/* ======== 次のお題 ======== */
function nextWord(){
  if(G.wordIdx>=G.words.length){G.words=shuffle(G.words);G.wordIdx=0;}
  G.current=G.words[G.wordIdx++];G.typed='';G.timeLeft=20;
  $('word-emoji').textContent=G.current.emoji;
  $('word-display').innerHTML='<ruby>'+escapeHTML(G.current.text)+'<rt>'+escapeHTML(G.current.reading)+'</rt></ruby>';
  renderTyped();startTimer();
}
function renderTyped(){
  const tgt=G.current.reading;
  $('typed-display').innerHTML=Array.from(tgt).map((ch,i)=>{
    const t=G.typed[i];
    if(t===undefined)return`<span class="typed-char">・</span>`;
    if(t===ch)return`<span class="typed-char filled">${t}</span>`;
    return`<span class="typed-char wrong">${t}</span>`;
  }).join('');
}
function renderLives(){const el=$('lives');el.innerHTML='';for(let i=0;i<2;i++){const h=document.createElement('div');h.className='heart'+(i>=G.lives?' lost':'');el.appendChild(h);}}
function renderScore(){$('score').textContent=G.score;}

/* ======== 体型ゲージ ======== */
function updateBodyGauge(eaten,stageUp){
  const idx=getStageIdx(eaten);
  const s=BODY_STAGES[idx];
  const prog=(eaten%STAGE_INTERVAL)/STAGE_INTERVAL*100;
  const fill=$('body-gauge-fill');
  fill.style.width=Math.min(prog,100)+'%';
  fill.classList.toggle('muscle',idx>=10);
  $('gauge-icon').textContent=s.icon;
  $('stage-badge').textContent=s.label;
  $('gauge-count').textContent=eaten+'こ';
  if(stageUp&&eaten>0){
    $('stage-badge').animate([{transform:'scale(1)',background:'var(--cream)'},{transform:'scale(1.5)',background:'#FFD93D'},{transform:'scale(1)',background:'var(--cream)'}],{duration:500});
  }
}

/* ======== キャラクター体型変化 ======== */
function applyBodyStage(idx,withPop){
  const s=BODY_STAGES[Math.min(idx,BODY_STAGES.length-1)];
  const ch=$('character');
  ch.style.transform=`scale(${s.sx},${s.sy})`;
  ch.querySelector('.muscle-arms').style.opacity=s.muscle;
  const isMuscle=idx>=10;
  ch.querySelector('.eyes-cool').style.opacity=isMuscle?'1':'0';
  ch.querySelector('.eyes-open').style.opacity=isMuscle?'0':'1';
  ch.querySelector('.mouth-cool').style.opacity=isMuscle?'1':'0';
  ch.querySelector('.mouth-smile').style.opacity=isMuscle?'0':'1';
  if(withPop){
    ch.classList.remove('body-change');void ch.offsetWidth;ch.classList.add('body-change');
    setTimeout(()=>ch.classList.remove('body-change'),900);
    sfx.levelup();
    popText(isMuscle?'筋肉ついた！💪':s.label+'！');
  }
}

/* ======== タイマー ======== */
function startTimer(){stopTimer();const st=performance.now();const dur=20000;G.timerId=setInterval(()=>{const el=performance.now()-st;G.timeLeft=Math.max(0,(dur-el)/1000);$('timer-fill').style.width=(G.timeLeft/20*100)+'%';if(G.timeLeft<=0){stopTimer();handleMiss(true);}},50);}
function stopTimer(){if(G.timerId){clearInterval(G.timerId);G.timerId=null;}}

/* ======== 入力処理 ======== */
function inputKana(kana){
  if(!G.playing)return;
  const tgt=G.current.reading,idx=G.typed.length;
  const canMod=k=>DAKUTEN[k]||HANDAKU[k]||SMALL[k];
  if(kana!==tgt[idx]&&!canMod(kana)){sfx.miss();$('typed-display').animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:250});return;}
  sfx.type();G.typed+=kana;renderTyped();checkAnswer();
}
function applyModifier(kind){
  if(!G.playing||!G.typed.length)return;
  const last=G.typed[G.typed.length-1],rest=G.typed.slice(0,-1);let neu=last;
  if(kind==='cycle'){const base=DAKU_REV[last]||HANDAKU_REV[last]||SMALL_REV[last]||last;const cy=[base];if(DAKUTEN[base])cy.push(DAKUTEN[base]);if(HANDAKU[base])cy.push(HANDAKU[base]);if(SMALL[base])cy.push(SMALL[base]);if(cy.length===1)return;neu=cy[(cy.indexOf(last)+1)%cy.length];}
  else if(kind==='dakuten'){if(DAKUTEN[last])neu=DAKUTEN[last];else if(DAKU_REV[last])neu=DAKU_REV[last];}
  else if(kind==='handakuten'){if(HANDAKU[last])neu=HANDAKU[last];else if(HANDAKU_REV[last])neu=HANDAKU_REV[last];}
  else if(kind==='small'){if(SMALL[last])neu=SMALL[last];else if(SMALL_REV[last])neu=SMALL_REV[last];}
  else if(kind==='bar'){if(G.typed.length<20){sfx.type();G.typed+='ー';renderTyped();checkAnswer();}return;}
  if(neu!==last){sfx.type();G.typed=rest+neu;renderTyped();checkAnswer();}
}
function backspace(){if(!G.playing||!G.typed.length)return;G.typed=G.typed.slice(0,-1);sfx.type();renderTyped();}
function clearInput(){if(!G.playing)return;G.typed='';renderTyped();}
function checkAnswer(){if(G.typed===G.current.reading){stopTimer();handleClear();}}

/* ======== クリア処理 ======== */
function handleClear(){
  G.playing=false;G.eaten++;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
  const gain=Math.floor((100+Math.floor(G.timeLeft*10))*(1+Math.min(G.combo-1,9)*.2));
  G.score+=gain;renderScore();
  const newStage=getStageIdx(G.eaten);
  const stageUp=newStage>G.bodyStage;
  G.bodyStage=newStage;
  updateBodyGauge(G.eaten,stageUp);
  const veg=$('veggie-fly');veg.textContent=G.current.emoji;veg.classList.remove('launch');void veg.offsetWidth;veg.classList.add('launch');
  const ch=$('character');
  setTimeout(()=>{ch.classList.add('chomp','happy');sfx.chomp();},320);
  setTimeout(()=>{
    ch.classList.remove('chomp');
    if(stageUp)applyBodyStage(newStage,true);
    flashScreen();
    if(!stageUp)popText(G.combo>=5?'GREAT!':G.combo>=3?'NICE!':'GOOD!');
    confettiBurst();sfx.clear();
  },560);
  setTimeout(()=>{ch.classList.remove('happy');if(G.eaten>=G.goalCount){showResult(true);}else{G.playing=true;nextWord();}},1400);
}

/* ======== ミス処理 ======== */
function handleMiss(timeout){
  G.playing=false;G.lives--;G.combo=0;renderLives();sfx.miss();
  $('game-screen').animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:300});
  if(timeout)popText('じかんぎれ！');
  setTimeout(()=>{if(G.lives<=0){showResult(false);}else{G.playing=true;nextWord();}},900);
}

/* ======== エフェクト ======== */
function flashScreen(){const f=$('fx-flash');f.classList.remove('active');void f.offsetWidth;f.classList.add('active');}
function popText(txt){const p=document.createElement('div');p.className='fx-text pop';p.textContent=txt;document.body.appendChild(p);setTimeout(()=>p.remove(),1000);}
function confettiBurst(){const cols=['#FF6B6B','#FFD93D','#7AC74F','#4D96FF','#FF8C42','#B983FF'];for(let i=0;i<28;i++){const c=document.createElement('div');c.className='confetti';c.style.background=cols[i%cols.length];c.style.left=(Math.random()*100)+'vw';c.style.top='-20px';document.body.appendChild(c);const dx=(Math.random()-.5)*200,dy=window.innerHeight*.7+Math.random()*200;c.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${720+Math.random()*360}deg)`,opacity:0}],{duration:1200+Math.random()*400,easing:'cubic-bezier(.3,.7,.5,1)'});setTimeout(()=>c.remove(),1700);}}

/* ======== 結果画面 ======== */
function showResult(win){
  stopTimer();G.playing=false;
  $('gameover-title').textContent=win?'クリア！ 🎉':'ゲームオーバー';
  $('stat-eaten').textContent=G.eaten+'こ';
  $('stat-score').textContent=G.score;
  $('stat-combo').textContent=G.maxCombo;
  const s=BODY_STAGES[Math.min(G.bodyStage,BODY_STAGES.length-1)];
  $('stat-stage').textContent=s.icon+' '+s.label;
  const goSvg=$('gameover-char');
  goSvg.innerHTML=$('character').innerHTML;
  goSvg.setAttribute('viewBox','-130 -160 260 320');
  goSvg.style.transform=`scale(${s.sx},${s.sy})`;
  goSvg.style.transformOrigin='center 78%';
  if(win){const eo=goSvg.querySelector('.eyes-open');if(eo)eo.style.opacity='0';const eh=goSvg.querySelector('.eyes-happy');if(eh)eh.style.opacity='1';}
  show('gameover-screen');
  if(win)sfx.fanfare();else sfx.gameover();
}

/* ======== フリック入力 ======== */
const popup=$('flick-popup');
let currentTouch=null;
function getDir(dx,dy){const dist=Math.hypot(dx,dy);if(dist<25)return'c';const a=Math.atan2(dy,dx)*180/Math.PI;if(a>-45&&a<=45)return'r';if(a>45&&a<=135)return'd';if(a>-135&&a<=-45)return'u';return'l';}
function showPopup(btn,map){const rect=btn.getBoundingClientRect();popup.innerHTML=`<div class="flick-cell u ${map.u?'':'empty'}" data-dir="u">${map.u||''}</div><div class="flick-cell l ${map.l?'':'empty'}" data-dir="l">${map.l||''}</div><div class="flick-cell c" data-dir="c">${map.c||''}</div><div class="flick-cell r ${map.r?'':'empty'}" data-dir="r">${map.r||''}</div><div class="flick-cell d ${map.d?'':'empty'}" data-dir="d">${map.d||''}</div>`;popup.style.left=(rect.left+rect.width/2)+'px';popup.style.top=(rect.top-70)+'px';popup.classList.add('active');}
function updPopup(dir){popup.querySelectorAll('.flick-cell').forEach(c=>c.classList.toggle('highlight',c.dataset.dir===dir&&!c.classList.contains('empty')));}
function hidePopup(){popup.classList.remove('active');}

function attachFlick(btn){
  const key=btn.dataset.flick;const map=FLICK[key];if(!map)return;
  const isAndroid=()=>G.device==='android';
  const start=(x,y)=>{sfx.init();currentTouch={x,y,btn,map,st:Date.now()};btn.classList.add('pressed');showPopup(btn,map);updPopup('c');};
  const move=(x,y)=>{if(!currentTouch||currentTouch.btn!==btn)return;updPopup(getDir(x-currentTouch.x,y-currentTouch.y));};
  const end=(x,y)=>{
    if(!currentTouch||currentTouch.btn!==btn)return;
    const dt=Date.now()-currentTouch.st;
    const dir=getDir(x-currentTouch.x,y-currentTouch.y);
    const kana=map[dir]||map.c;
    if(dir==='c'&&dt>280&&isAndroid()){
      const hint=$('speed-hint');if(hint){hint.textContent='⚡フリックで速く！タップは遅いよ';setTimeout(()=>{if(hint)hint.textContent='⚡フリックで速く入力できます';},2200);}
    }
    if(kana)inputKana(kana);
    hidePopup();btn.classList.remove('pressed');currentTouch=null;
  };
  btn.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];start(t.clientX,t.clientY);},{passive:false});
  btn.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];move(t.clientX,t.clientY);},{passive:false});
  btn.addEventListener('touchend',e=>{e.preventDefault();const t=e.changedTouches[0];end(t.clientX,t.clientY);},{passive:false});
  btn.addEventListener('touchcancel',()=>{hidePopup();btn.classList.remove('pressed');currentTouch=null;});
  btn.addEventListener('mousedown',e=>{e.preventDefault();start(e.clientX,e.clientY);});
  document.addEventListener('mousemove',e=>{if(currentTouch&&currentTouch.btn===btn)move(e.clientX,e.clientY);});
  document.addEventListener('mouseup',e=>{if(currentTouch&&currentTouch.btn===btn)end(e.clientX,e.clientY);});
}

document.querySelectorAll('#keyboard-iphone .key[data-flick]').forEach(attachFlick);
document.querySelectorAll('#keyboard-android .key-android[data-flick]').forEach(attachFlick);

document.querySelectorAll('.key[data-mod],.key-android[data-mod],.android-tool-btn[data-mod]').forEach(btn=>{
  const mod=btn.dataset.mod;
  const press=e=>{e.preventDefault();sfx.init();btn.classList.add('pressed');if(mod==='back')backspace();else if(mod==='clear')clearInput();else if(mod==='bar')applyModifier('bar');else if(mod==='cycle')applyModifier('cycle');};
  const rel=()=>btn.classList.remove('pressed');
  btn.addEventListener('touchstart',press,{passive:false});
  btn.addEventListener('touchend',e=>{e.preventDefault();rel();},{passive:false});
  btn.addEventListener('mousedown',press);btn.addEventListener('mouseup',rel);btn.addEventListener('mouseleave',rel);
});

document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
show('title-screen');
</script>
